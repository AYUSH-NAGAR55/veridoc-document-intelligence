services:
  - type: web
    name: veridoc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veridoc-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://veridoc-frontend.onrender.com
      - key: UPLOAD_DIR
        value: ./storage/uploads
      - key: INDEX_DIR
        value: ./storage/index
    disk:
      name: veridoc-storage
      mountPath: /app/storage
      sizeGB: 5

  - type: web
    name: veridoc-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://veridoc-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: veridoc-db
    plan: starter
    databaseName: veridoc
    user: veridoc
